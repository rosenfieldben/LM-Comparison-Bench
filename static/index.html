<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>LM Comparison Bench</title>
<!-- Blocking, in <head> on purpose: the pre-paint prefs must be on <html>
     before first paint or the page flashes the defaults. Externalized from
     an inline block so the CSP needs no script-src 'unsafe-inline'. -->
<script src="/static/theme-boot.js"></script>
<link rel="stylesheet" href="/static/volt.css">
</head>
<body>
<header id="cmdbar">
  <div id="brand">
    <h1>LM<span class="sl">//</span>Bench</h1>
    <span class="bar-sub">openrouter · <span id="bar-host">localhost:8000</span></span>
  </div>
  <div id="stats">
    <div class="stat" id="stat-runs"><span class="k">runs</span><span class="v">00</span></div>
    <div class="stat" id="stat-spend"><span class="k">composer spend</span><span class="v" data-testid="stat-spend" title="no composer run priced yet this session. The composer&#39;s runs only: an experiment&#39;s cost is in its report">~$0.0000</span></div>
    <div class="stat" id="stat-ttft"><span class="k">avg ttft</span><span class="v">—</span></div>
    <div class="stat" id="stat-lineup"><span class="k">lineup</span><span class="v">—</span></div>
    <!-- Shown only when BENCH_DATA_POLICY is not standard, so a session
         routed under a confidentiality policy is never ambiguous at a
         glance. Hidden by default: absence means the default routing. -->
    <span id="policy-badge" data-testid="policy-badge" hidden></span>
  </div>
  <div id="prefs">
    <button id="theme-btn" type="button" class="pref"
            title="Color theme; auto follows the OS scheme">theme auto</button>
    <button id="motion-btn" type="button" class="pref"
            title="Ambient animation; elapsed counters keep updating either way">motion on</button>
  </div>
</header>

<div id="page">
<section id="deck" class="panel" aria-label="Run controls">
  <div id="prompt-row">
    <label class="panel-label" for="prompt">Prompt</label>
    <span id="linked-name" data-testid="linked-name"></span>
    <span id="prompt-msg" data-testid="prompt-msg" role="status"></span>
    <div id="prompt-actions">
      <span class="sel-wrap">
        <select id="saved-prompts" data-testid="saved-prompts" aria-label="Saved prompts">
          <option value="">Saved</option>
        </select>
      </span>
      <button id="save-prompt" data-testid="save-prompt" type="button">Save</button>
      <span id="name-row" hidden>
        <input id="prompt-name" data-testid="prompt-name" type="text" placeholder="Name for this prompt">
        <button id="confirm-save" data-testid="confirm-save" type="button">OK</button>
        <button id="cancel-save" type="button" class="ghost">Cancel</button>
      </span>
      <button id="delete-prompt" type="button" disabled>Delete</button>
    </div>
  </div>
  <div id="prompt-box">
    <span class="caret-glyph" aria-hidden="true">❯</span>
    <textarea id="prompt" data-testid="prompt-input" rows="1" placeholder="Prompt to send to every checked model"></textarea>
  </div>

  <!-- Documents. Every attached file reaches every model in the
       comparison identically; the mode decides HOW, and the note beside
       it says what each mode measures because that choice changes the
       experiment, not just the plumbing. -->
  <div id="attach-row">
    <span class="panel-label" id="attach-label">Documents</span>
    <div id="attachments" data-testid="attachments"></div>
    <div id="attach-actions">
      <label class="attach-btn" for="attach-input">+ Attach</label>
      <input id="attach-input" data-testid="attach-input" type="file" multiple
             accept=".txt,.md,.pdf,.docx,.png,.jpg,.jpeg,.webp">
      <span class="sel-wrap">
        <select id="attach-mode" data-testid="attach-mode" aria-label="How documents reach the models">
          <option value="inline">inline: the bench extracts the text</option>
          <option value="native">native: the model sees the image</option>
        </select>
      </span>
      <!-- A repository snapshot is an attachment the bench composes
           rather than one the person uploads, so it sits beside Attach
           and produces the same chip. Disabled, with the server's own
           refusal in the title, when BENCH_REPO_ROOTS is unset: a
           control that offers a door the server will refuse is worse
           than one that says why it cannot. -->
      <button id="snapshot-open" data-testid="snapshot-open" type="button"
              class="attach-btn" aria-expanded="false"
              aria-controls="snapshot-panel">+ Snapshot</button>
    </div>
    <div id="snapshot-panel" data-testid="snapshot-panel" hidden>
      <input id="snapshot-root" data-testid="snapshot-root" type="text"
             aria-label="Clone root to snapshot"
             placeholder="Clone root, an absolute path under BENCH_REPO_ROOTS">
      <!-- One pattern per line, never comma-separated: the server takes
           a comma literally and inside a character class, so a comma
           split would send two patterns where one was typed. -->
      <textarea id="snapshot-patterns" data-testid="snapshot-patterns" rows="2"
                aria-label="Include patterns, one per line"
                placeholder="Include patterns, one per line: bench/**/*.py then README.md"></textarea>
      <button id="snapshot-compose" data-testid="snapshot-compose"
              type="button">Compose snapshot</button>
    </div>
    <!-- Outside the panel on purpose. When BENCH_REPO_ROOTS is unset the
         panel never opens, and the server's own sentence has to be
         readable anyway: a reason available only in a disabled button's
         hover title is a reason no keyboard user ever sees. -->
    <div id="snapshot-msg" data-testid="snapshot-msg" role="status"></div>
    <div id="attach-msg" data-testid="attach-msg" role="status"></div>
    <div id="attach-note" data-testid="attach-note"></div>
  </div>

  <div id="lineup-row">
    <span class="panel-label" id="lineup-label">Lineup 0/0</span>
    <div id="models" data-testid="lineup"></div>
    <div id="lineup-actions">
      <button id="select-all" type="button" class="ghost">All</button>
      <button id="select-none" type="button" class="ghost">None</button>
      <button id="add-model" type="button" aria-expanded="false">+ Add model</button>
    </div>
  </div>
  <div id="model-search" hidden>
    <label class="panel-label" for="model-query">Model search</label>
    <input id="model-query" type="text" placeholder="Search models by name or id">
    <div id="search-msg" role="status"></div>
    <div id="model-matches"></div>
  </div>

  <div id="controls-row">
    <button id="toggle-controls" data-testid="toggle-controls" type="button"
            aria-expanded="false" aria-controls="experiment-controls"
            title="Sampling and routing sent identically on every request in this comparison"
            >+ Controls</button>
    <span id="controls-summary" data-testid="controls-summary" role="status"></span>
  </div>
  <!-- The min, max and option values below mirror ExperimentParams in
       bench/main.py, which is the single source of truth for every bound.
       They exist here only so the browser can refuse a value before it
       costs one 422 per model; the API is what actually enforces them.
       tests/test_api.py::test_the_markup_bounds_match_the_shared_request_model
       asserts the two sets agree, because a markup bound tighter than the
       model's would block a run the API would have accepted and tell the
       user their legal value is out of range. -->
  <div id="experiment-controls" data-testid="experiment-controls" hidden>
    <label class="panel-label" for="ctl-system">System prompt</label>
    <textarea id="ctl-system" data-testid="ctl-system" rows="2"
              placeholder="Leave blank to send no system message"
              title="Sent as a leading system message to every model. Blank sends none, which is what the bench has always done"></textarea>
    <!-- step="any" on the two float inputs, not a hundredth. step is a
         validity constraint, not a spinner hint: with step="0.01" the
         browser marks 0.005 or 0.7071 invalid and refuses a value the API
         accepts, which is the same "markup tighter than the model" failure
         the bounds comment above guards against. seed keeps step="1"
         because integer really is the constraint there. -->
    <div id="controls-scalars">
      <span class="ctl">
        <label for="ctl-temperature">temperature</label>
        <input id="ctl-temperature" data-testid="ctl-temperature" type="number"
               min="0" max="2" step="any" placeholder="unset"
               title="0 to 2. Lower is more predictable. Blank sends nothing, so each provider applies its own default (1.0 for most)">
      </span>
      <span class="ctl">
        <label for="ctl-top-p">top_p</label>
        <input id="ctl-top-p" data-testid="ctl-top-p" type="number"
               min="0" max="1" step="any" placeholder="unset"
               title="0 to 1. Limits sampling to the most likely tokens adding up to P. Blank sends nothing, so each provider applies its own default">
      </span>
      <span class="ctl">
        <label for="ctl-seed">seed</label>
        <input id="ctl-seed" data-testid="ctl-seed" type="number" step="1"
               min="-9007199254740991" max="9007199254740991" placeholder="unset"
               title="Passed through and recorded, nothing more. Providers differ in whether they accept a seed at all and in how deterministic they are with one; OpenRouter says the same seed SHOULD give the same result and that determinism is not guaranteed for some models. A run that came back different is a fact about the provider, not a bug here">
      </span>
      <span class="ctl">
        <label for="ctl-effort">reasoning</label>
        <span class="sel-wrap">
          <select id="ctl-effort" data-testid="ctl-effort"
                  title="How much of the budget a reasoning model spends thinking. Only some models support it; the rest ignore it, which OpenRouter documents. Blank sends nothing">
            <option value="">unset</option>
            <option value="low">low</option>
            <option value="medium">medium</option>
            <option value="high">high</option>
          </select>
        </span>
      </span>
      <span class="ctl">
        <label for="ctl-routing">routing</label>
        <span class="sel-wrap">
          <select id="ctl-routing" data-testid="ctl-routing"
                  title="Which provider serves each model. Unset sends nothing and the bench's own throughput preference applies; picking throughput sends and records that same choice. price prefers the cheapest host. load balanced asks OpenRouter to choose, which is its own default">
            <option value="">unset (throughput)</option>
            <option value="throughput">throughput</option>
            <option value="price">price</option>
            <option value="default">load balanced</option>
          </select>
        </span>
      </span>
    </div>
    <div id="controls-note" data-testid="controls-note" role="status"></div>
  </div>

  <div id="run-row">
    <button id="run" data-testid="run-button" disabled>Run</button>
    <button id="stop" data-testid="stop-button" type="button" disabled>Stop</button>
    <div class="seg" id="budget-seg" role="group" aria-label="Completion token budget"
         title="Completion token budget for every model in the run">
      <button type="button" data-value="standard" data-testid="budget-standard" aria-pressed="true">standard 16k</button>
      <button type="button" data-value="extended" data-testid="budget-extended" aria-pressed="false">extended 64k</button>
    </div>
    <div class="seg" id="density-seg" role="group" aria-label="Column density"
         title="Result card density; compact fits more models side by side">
      <button type="button" data-value="comfortable" aria-pressed="true">comfortable</button>
      <button type="button" data-value="compact" aria-pressed="false">compact</button>
    </div>
    <span id="run-note" role="status"></span>
  </div>
</section>

<section id="race" class="panel" hidden aria-label="Time to first token">
  <div id="race-head">
    <span id="race-dot"></span>
    <span class="panel-label">Time to first token</span>
    <span id="race-scale"></span>
  </div>
  <div id="race-grid"></div>
</section>

<div id="run-label" data-testid="run-label" role="status"></div>
<div id="run-controls" data-testid="run-controls"></div>
<div id="results"></div>

<div id="diff-panel" data-testid="diff-panel" class="panel" hidden>
  <div id="diff-header">
    <span id="diff-dot"></span>
    <span id="diff-label">Diff</span>
    <span id="diff-title"></span>
    <button id="diff-close" data-testid="diff-close" type="button" class="tool diff-btn">close</button>
  </div>
  <div id="diff-body" data-testid="diff-body"></div>
</div>

<!-- Datasets: compose one, store it, and select a stored one by its
     digest. The browser composes and the server validates: nothing in
     this panel decides whether a dataset is valid, and a refusal is the
     server's own sentence, printed beside the row whose line it names.
     Collapsed until opened, like the history and the experiments. -->
<details id="datasets">
  <summary data-testid="datasets-toggle">Datasets</summary>
  <div id="dataset-builder" data-testid="dataset-builder">
    <div id="dataset-head">
      <label class="panel-label" for="dataset-name">Name</label>
      <input id="dataset-name" data-testid="dataset-name" type="text"
             autocomplete="off" placeholder="Name this dataset">
      <div class="seg" id="dataset-mode" role="group" aria-label="How the tasks are composed">
        <button type="button" data-value="rows" data-testid="dataset-mode-rows" aria-pressed="true">rows</button>
        <button type="button" data-value="jsonl" data-testid="dataset-mode-jsonl" aria-pressed="false">JSONL</button>
      </div>
    </div>
    <div id="dataset-rows-pane" data-testid="dataset-rows-pane">
      <div id="dataset-rows" data-testid="dataset-rows"></div>
      <div id="dataset-row-actions">
        <button id="dataset-add-row" data-testid="dataset-add-row" type="button">+ Task</button>
        <button id="dataset-from-prompts" data-testid="dataset-from-prompts" type="button"
                aria-expanded="false" aria-controls="dataset-prompt-picker">+ From saved prompts</button>
      </div>
      <div id="dataset-prompt-picker" data-testid="dataset-prompt-picker" hidden></div>
    </div>
    <!-- Pasted or uploaded text is sent exactly as it is: the page counts
         its lines for the label and parses nothing. An uploaded file is
         held as the text its bytes decoded to rather than put in the
         textarea, because a textarea normalizes CRLF to LF and the stored
         digest would then not be the file's; the textarea is hidden while
         a file is loaded, so the page never shows one dataset and stores
         another. autocomplete="off" on this box and the name, or Back
         would refill a draft nobody chose to keep. -->
    <div id="dataset-jsonl-pane" data-testid="dataset-jsonl-pane" hidden>
      <textarea id="dataset-jsonl" data-testid="dataset-jsonl" rows="6"
                autocomplete="off" aria-label="Dataset as JSONL, one task per line"
                placeholder="One task per line, as JSON: {&quot;id&quot;: &quot;t1&quot;, &quot;prompt&quot;: &quot;...&quot;}"></textarea>
      <div id="dataset-file-row">
        <label class="attach-btn" for="dataset-file">+ Upload JSONL</label>
        <input id="dataset-file" data-testid="dataset-file" type="file"
               accept=".jsonl,.json,.txt">
        <span id="dataset-file-label" data-testid="dataset-file-label"></span>
        <button id="dataset-file-clear" data-testid="dataset-file-clear" type="button" hidden>clear</button>
      </div>
    </div>
    <div id="dataset-ceilings" data-testid="dataset-ceilings"></div>
    <div id="dataset-store-row">
      <button id="dataset-store" data-testid="dataset-store" type="button" disabled>Store</button>
      <span id="dataset-nudge" data-testid="dataset-nudge" role="status"></span>
    </div>
    <div id="dataset-msg" data-testid="dataset-msg" role="status"></div>
  </div>
  <div id="dataset-library-head">
    <span class="panel-label">Stored</span>
    <span id="dataset-selected" data-testid="dataset-selected" role="status"></span>
  </div>
  <div id="dataset-library" data-testid="dataset-library" data-state="idle"></div>
</details>

<!-- Experiments: create one over a stored dataset, start it, watch it,
     stop it, score it, and open its report. Money moves on Start, and on
     Score when a judge grades; Create is free and says so, and Score says
     which it is. The lineup, budget and controls are the composer's own,
     read when Create is pressed, so there is one of each on the page. -->
<details id="experiments">
  <summary data-testid="experiments-toggle">Experiments</summary>
  <div id="experiment-create" data-testid="experiment-create">
    <div id="experiment-head">
      <label class="panel-label" for="experiment-name">Name</label>
      <input id="experiment-name" data-testid="experiment-name" type="text"
             autocomplete="off" placeholder="Name this experiment">
    </div>
    <div id="experiment-sources" data-testid="experiment-sources">
      <span id="experiment-source-dataset" data-testid="experiment-source-dataset"></span>
      <span id="experiment-source-lineup" data-testid="experiment-source-lineup"></span>
      <span id="experiment-source-budget" data-testid="experiment-source-budget"></span>
      <span id="experiment-source-controls" data-testid="experiment-source-controls"></span>
    </div>
    <!-- The min and max below mirror ExperimentCreate in bench/main.py
         (repeats 1 to MAX_REPEATS, the task order seed 0 to MAX_SEED),
         which is what enforces them. They exist so the browser can say a
         value is out of range before a 422; tests/test_api.py holds the
         two equal, because a markup bound tighter than the model's would
         refuse a legal value. -->
    <div id="experiment-fields">
      <label class="xp-cap">
        <span class="xp-cap-text">repeats · blank runs each task once</span>
        <input id="experiment-repeats" data-testid="experiment-repeats"
               type="number" min="1" max="20" step="1" autocomplete="off">
      </label>
      <label class="xp-cap">
        <span class="xp-cap-text">task order seed · blank keeps file order</span>
        <input id="experiment-seed" data-testid="experiment-seed"
               type="number" min="0" max="9007199254740991" step="1" autocomplete="off">
      </label>
      <!-- Each select is named by its caption through aria-labelledby, and
           not by a wrapping label: the wrapper would hold the sel-wrap,
           whose drawn arrow would then be read as part of the name. The
           notes below describe the two whose choice needs a sentence.
           autocomplete="off" on every control here, or Back refills a
           choice nobody made on this page. -->
      <div class="xp-cap">
        <span class="xp-cap-text" id="experiment-estimand-caption">estimand</span>
        <span class="sel-wrap">
          <select id="experiment-estimand" data-testid="experiment-estimand"
                  autocomplete="off" aria-labelledby="experiment-estimand-caption"
                  aria-describedby="experiment-estimand-note">
            <option value="routed_service">routed service</option>
            <option value="underlying_model">underlying model</option>
          </select>
        </span>
      </div>
      <div class="xp-cap">
        <span class="xp-cap-text" id="experiment-attachments-caption">attachments</span>
        <span class="sel-wrap">
          <select id="experiment-attachments" data-testid="experiment-attachments"
                  autocomplete="off" aria-labelledby="experiment-attachments-caption"
                  aria-describedby="experiment-attachments-note">
            <option value="inline">inline</option>
            <option value="native">native</option>
          </select>
        </span>
      </div>
      <div class="xp-cap">
        <span class="xp-cap-text" id="experiment-metric-caption">primary metric</span>
        <span class="sel-wrap">
          <select id="experiment-metric" data-testid="experiment-metric"
                  autocomplete="off" aria-labelledby="experiment-metric-caption">
            <option value="">none declared</option>
          </select>
        </span>
      </div>
      <label class="xp-check">
        <input id="experiment-halt" data-testid="experiment-halt" type="checkbox"
               autocomplete="off" checked>
        <span>halt on refusal</span>
      </label>
    </div>
    <div id="experiment-notes">
      <span id="experiment-estimand-note" data-testid="experiment-estimand-note"></span>
      <span id="experiment-attachments-note" data-testid="experiment-attachments-note"></span>
    </div>
    <div id="experiment-create-row">
      <button id="experiment-create-button" data-testid="experiment-create-button"
              type="button" disabled>Create · free</button>
      <span id="experiment-create-nudge" data-testid="experiment-create-nudge" role="status"></span>
    </div>
    <div id="experiment-create-msg" data-testid="experiment-create-msg" role="status"></div>
  </div>
  <div id="experiment-selected" data-testid="experiment-selected" hidden>
    <div id="experiment-title" data-testid="experiment-title"></div>
    <div id="experiment-status" data-testid="experiment-status" role="status"></div>
    <div id="experiment-counters" data-testid="experiment-counters"></div>
    <div id="experiment-stream" data-testid="experiment-stream" role="status"></div>
    <div id="experiment-dataset" data-testid="experiment-dataset"></div>
    <div id="experiment-start-row">
      <button id="experiment-start" data-testid="experiment-start" type="button"
              aria-describedby="experiment-projection experiment-start-note" disabled>Start</button>
      <span id="experiment-projection" data-testid="experiment-projection"></span>
      <span id="experiment-start-note" data-testid="experiment-start-note"></span>
      <button id="experiment-stop" data-testid="experiment-stop" type="button" hidden>Stop</button>
    </div>
    <!-- Scoring, for a finished experiment only: absent while it is
         created or running, when the door would refuse it. The judge
         select is the whole catalog, filtered by nothing, and is shown
         only when the experiment's recorded dataset has judge tasks. -->
    <div id="experiment-score-row" data-testid="experiment-score-row" hidden>
      <div class="xp-cap" id="experiment-judge-field">
        <span class="xp-cap-text" id="experiment-judge-caption">judge</span>
        <span class="sel-wrap">
          <select id="experiment-judge" data-testid="experiment-judge"
                  autocomplete="off" aria-labelledby="experiment-judge-caption"
                  aria-describedby="experiment-judge-note">
            <option value="">choose a judge</option>
          </select>
        </span>
      </div>
      <button id="experiment-score" data-testid="experiment-score" type="button"
              aria-describedby="experiment-score-nudge experiment-score-note" disabled>Score</button>
      <span id="experiment-score-nudge" data-testid="experiment-score-nudge" role="status"></span>
      <!-- Present only when reading the experiment's dataset failed: it
           asks the store again, which is the only thing that clears that
           state short of selecting the experiment again. -->
      <button id="experiment-score-retry" data-testid="experiment-score-retry" type="button"
              aria-describedby="experiment-score-nudge" hidden>Retry</button>
      <div id="experiment-score-notes">
        <span id="experiment-judge-note" data-testid="experiment-judge-note"></span>
        <span id="experiment-score-note" data-testid="experiment-score-note"></span>
      </div>
    </div>
    <div id="experiment-action-msg" data-testid="experiment-action-msg" role="status"></div>
  </div>
  <div id="experiment-list-head">
    <span class="panel-label">Recorded</span>
    <span id="experiment-list-note" data-testid="experiment-list-note"></span>
  </div>
  <div id="experiment-list" data-testid="experiment-list" data-state="idle"></div>
</details>

<section id="report-panel" data-testid="report-panel" hidden aria-label="Experiment report"></section>

<details id="history">
  <summary data-testid="history-toggle">History</summary>
  <div id="history-tools">
    <input id="history-filter" type="text" aria-label="Filter history"
           placeholder="filter: prompt or model id">
    <span id="history-note"></span>
  </div>
  <div id="history-list" data-testid="history-list" data-state="idle"></div>
</details>
</div>

<!-- Classic scripts in dependency order: the order is load-bearing.
     Each module assigns its window.Bench* namespace, and later modules
     read earlier ones, so a reorder breaks the page at load. -->
<script src="/static/lib.js"></script>
<script src="/static/state.js"></script>
<script src="/static/controls.js"></script>
<script src="/static/attach.js"></script>
<script src="/static/render.js"></script>
<script src="/static/diff.js"></script>
<script src="/static/library.js"></script>
<script src="/static/stream.js"></script>
<script src="/static/rating.js"></script>
<script src="/static/experiments.js"></script>
<script src="/static/datasets.js"></script>
<script src="/static/lifecycle.js"></script>
<script src="/static/history.js"></script>
<script src="/static/boot.js"></script>
</body>
</html>
